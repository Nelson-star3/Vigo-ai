[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  # Free plan default is 10s. 26s only applies if Netlify enables it for your site.
  timeout = 26

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200
